name: deploy to github pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # registry 真源在插件仓库，这边收不到它的 push 事件；
  # 定时重建让公网最迟 30 分钟自动同步一次（GUI 删改、issue 审核通过都走这条）
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: 拉取最新 registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/fetch-registry.mjs
      - run: npx vitepress build docs

      - name: registry 同源副本
        run: cp docs/plugins/registry.json docs/.vitepress/dist/registry.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
